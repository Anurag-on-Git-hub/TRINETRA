services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@db:5432/trinetra
      JWT_SECRET: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
